services:
  neo4j:
    image: neo4j:5.24-enterprise
    environment:
      NEO4J_AUTH: neo4j/devpassword
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    # Host ports are overridable in .env (set these AND NEO4J_URI to match if the
    # defaults clash with another local service).
    ports: ["${NEO4J_HTTP_PORT:-7474}:7474", "${NEO4J_BOLT_PORT:-7687}:7687"]
    volumes: ["neo4j_data:/data"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cobol
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: cobol_modernizer
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: devpassword
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes:
  neo4j_data: {}
  pg_data: {}
  minio_data: {}
